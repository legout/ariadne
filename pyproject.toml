# Workspace root — coordination only (spec 0030 §2, spec 0031 §4).
# NOT a distributable package: this file declares the uv workspace, one
# development lockfile, shared dev tooling and the shared coordination test
# selection. The three members are products/ariadne/packages/ariadne-data,
# products/lumio/packages/lumio-wiki and products/lumio/packages/lumio-lancedb;
# the Agent keeps its own separate environment and is not a workspace member.
# Product-native suites/lint run scoped from their product areas
# (products/lumio/pytest.ini and .ruff.toml; the Core member's own config).
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "products/ariadne/packages/ariadne-data",
    "products/lumio/packages/lumio-lancedb",
    "products/lumio/packages/lumio-wiki",
]

[tool.uv.sources]
# Local members for joint development only; published dependency metadata
# of the members is unchanged (spec 0030 §3).
ariadne-data = { workspace = true }
lumio-lancedb = { workspace = true }
lumio-wiki = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    # obstore stays an optional wheel extra (lumio-wiki[s3]); the workspace
    # environment runs the ObjectStore contract suite in every CI/local run.
    "obstore>=0.11.0",
    "liteparse>=2.4.0",
    "markitdown[docx]>=0.1.6",
    "firecrawl-anydoc==0.1.3",
    "openai>=1.40.0",
    # ariadne-data pins the tested SDK version (mcp==2.2.0); this also
    # satisfies lumio-wiki's >=2.2.0 floor — the union of both native dev sets.
    "mcp==2.2.0",
]

[tool.pytest.ini_options]
# Resolve the shared/integration test trees as packages, never the private
# lumio application namespace.
consider_namespace_packages = true
# Make the repository root importable for the documented serial console runner too,
# not only under xdist or after test_wheel_verifier's sys.path bootstrap.
pythonpath = ["."]
# Shared coverage only (spec 0031 §4): workspace coordination checks plus the
# two paired Core/SDK integration modules. This is NOT either product's
# complete native suite — Lumio runs from products/lumio with its own
# selection, Core from its member directory with its own config.
testpaths = [
    "tests",
    "integration/tests/lumio_metric_mvp.py",
    "integration/tests/lumio_local_context.py",
]
markers = [
    "slow: tests that build wheels or create isolated virtual environments",
]

[tool.ruff]
line-length = 100
# The root selection owns the shared trees only: tests/, integration/ and
# repository coordination files. Product areas lint themselves under their
# own configurations — the Core member (E,F,W,I,UP — no B) from
# products/ariadne/packages/ariadne-data, Lumio's product-wide rules
# (E,F,I,UP,B) from products/lumio/.ruff.toml, and the Agent from its
# own separate config. Spec 0031 §4: the root default must not silently
# mean either product's suite/style.
extend-exclude = ["products"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
# The uv workspace venv (uv sync creates .venv with the members installed).
venvPath = "."
venv = ".venv"
