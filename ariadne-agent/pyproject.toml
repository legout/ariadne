[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-agent"
version = "0.1.0"
description = "Installable Ariadne Agent backend: fixed-role conversations over native Ariadne tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Never bare `ariadne` — that is the unrelated PyPI GraphQL project (ADR-0014).
    "ariadne-core>=0.1.0",
    # The release whose embeddable tau_agent.AgentHarness / tau_ai.OpenAICompatibleProvider
    # import paths were verified for this package (ADR-0014: pin what was tested).
    "tau-ai==0.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# Local development only: resolve ariadne-core from the repository checkout
# without publishing it. This is uv tool configuration, never published
# dependency metadata (issue #23).
ariadne-core = { path = ".." }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
