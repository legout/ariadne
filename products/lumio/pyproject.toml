# Lumio product area — product-wide test/lint selection (spec 0031 §4).
# Tool-only file: no [project] table, no uv workspace. The members keep their
# own manifests (packages/lumio-wiki, packages/lumio-lancedb); this file only
# carries Lumio's native pytest/ruff defaults so the repository root's
# selection can stay shared. Same rules the root applied to the Lumio-side
# trees before the product-area layout; no rule change.
[tool.pytest.ini_options]
consider_namespace_packages = true
# Lumio native full suite: product-wide tests, both member test trees, eval.
# Fixed four workers in CI and docs — never -n auto.
testpaths = [
    "tests",
    "packages/lumio-lancedb/tests",
    "packages/lumio-wiki/tests",
    "eval",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
# The shared workspace venv lives at the monorepo root (spec 0031 §4).
venvPath = "../.."
venv = ".venv"
