[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadneai"
version = "0.1.0"
description = "Governed metrics for autonomous agents: OKF context layer + OSI semantic layer behind one MCP facade"
readme = "README.md"
requires-python = ">=3.12"  # ADR-0008: the datus <3.13 cap left with datus
dependencies = [
    "duckdb>=1.0",
    "sqlglot>=25.0",  # own compile engine: ariadne/render.py (ADR-0008) + grain guard
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
ariadne = "ariadne.cli:main"  # the local JSON CLI (spec 2026-09-23-0001 §4)
ariadne-ingest = "ariadne.ingest:main"
ariadne-author = "ariadne.author:main"
ariadne-validate = "ariadne.validate:main"
ariadne-serve = "ariadne.serve:main"  # the MCP facade; combined toolset by default (G6)
# The Analyst/Authoring registrations of the same adapter (spec 0009 §6, issue #38):
# the entry point fixes the toolset — launch ariadne-serve to select one explicitly.
ariadne-analyst-mcp = "ariadne.serve:analyst_main"
ariadne-authoring-mcp = "ariadne.serve:authoring_main"
ariadne-promote = "ariadne.promote:main"
ariadne-init = "ariadne.init:main"
ariadne-skill = "ariadne.skill:main"
ariadne-profiler = "ariadne.profiler:main"
ariadne-authoring = "ariadne.authoring_cli:main"  # harness-led authoring (issue #13)
ariadne-admit = "ariadne.admission:main"  # HUMAN-ONLY Git Review Admission (issue #37, G5)
ariadne-example-review = "ariadne.example_review:main"  # operator-only example review (issue #20)

[project.optional-dependencies]
# ADR-0012/spec §7: MCP is the optional transport extra — the base install
# serves the full local interface without importing or installing it.
mcp = [
    "mcp>=1.2,<2",  # 2.x renames FastMCP (facade tool registry) — migration is out of scope
]
# ADR-0009 document ingestion: the lumio-wiki-researched converter stack. Optional
# so the base install stays lightweight; ariadne-ingest fails with install guidance
# when a converter is missing. dev gains the same deps so the test suite covers them.
documents = [
    "liteparse>=2.4.0",  # PDF
    "markitdown[docx]>=0.1.6",  # docx/pptx/xlsx
    "firecrawl-anydoc==0.1.3",  # html
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mcp>=1.2,<2",  # dev gains the mcp extra so the test suite covers the adapter
    "liteparse>=2.4.0",
    "markitdown[docx]>=0.1.6",
    "firecrawl-anydoc==0.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The packaged agent skill ships in the wheel, version-locked to the package
# (ADR-0011); ariadne skill install copies it out.
ariadne = ["skill_assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
