[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-data"
version = "0.8.0"
description = "Governed metrics for autonomous agents: one Lumio knowledge foundation plus the OSI semantic layer behind one MCP facade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0,<3",  # spec 0039 §4: 2.x removed relation fetchone/fetchmany; bounded reads use cursor methods
    "sqlglot>=25.0",  # own compile engine: ariadne/render.py (ADR-0008) + grain guard
    "openai>=1.40",
    "pyyaml>=6.0",
    "jsonschema>=4.18",  # spec 0028 §2: pinned ODCS v3.2.0 structural validation (Draft 2019-09)
    # spec0035/ADR-0029: the Lumio SDK is MANDATORY (the native KB, its public
    # setup/authoring contracts and page mutations are the one knowledge path);
    # MCP/cloud/model capabilities stay optional extras. The floor names the
    # coordinated SDK release 0.7.0 — published 0.6.0 lacks the public
    # empty-setup exports Core consumes.
    "lumio-wiki>=0.7,<0.8",
]

[project.scripts]
ariadne = "ariadne.cli:main"  # the one CLI (spec 0040 §3.1)

[project.optional-dependencies]
# ADR-0012/spec §7: MCP is the optional transport extra — the base install
# serves the full local interface without importing or installing it.
mcp = [
    "mcp==2.2.0",  # spec 0026 §2: the exact official SDK of the Lumio 93951f8 baseline (mcp-types==2.2.0 rides along)
]
spreadsheets = [
    "openpyxl>=3.1,<4",  # stored XLSX cells/formula presence only; never Excel execution
]
# ADR-0009 document conversion, now serving the NATIVE intake's bounded
# Seed-Notes document parts only (spec0035/ADR-0029: onboarding itself is
# Lumio-native; the retired ariadne-ingest orchestration and CLI are gone).
# Optional so the base install stays lightweight. dev gains the same deps so
# the test suite covers them.
documents = [
    "liteparse>=2.4.0",  # PDF
    "markitdown[docx]>=0.1.6",  # html
    "lxml<6.2",  # #220: lxml 6.2.0 breaks markitdown 0.1.9 DOCX conversion (2026-11-28); remove when fixed upstream
    "firecrawl-anydoc==0.2.5",  # Office/OpenDocument/RTF/EPUB/CSV
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mcp==2.2.0",  # dev gains the mcp extra so the test suite covers the adapter
    "liteparse>=2.4.0",
    "markitdown[docx]>=0.1.6",
    "lxml<6.2",  # #220: lxml 6.2.0 breaks markitdown 0.1.9 DOCX conversion (2026-11-28); remove when fixed upstream
    "firecrawl-anydoc==0.2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The packaged agent skill ships in the wheel, version-locked to the package
# (ADR-0011); ariadne skill install copies it out.
ariadne = ["skill_assets/**/*", "schemas/odcs/*", "schemas/ossie/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
# The shared workspace venv lives at the monorepo root; this member moved
# under products/ariadne/packages/ariadne-data (spec 0031 §3).
venvPath = "../../../.."
venv = ".venv"
exclude = ["build", "**/.venv", "examples/trace-data/data/docs"]
executionEnvironments = [
    { root = ".", extraPaths = ["src"] },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
