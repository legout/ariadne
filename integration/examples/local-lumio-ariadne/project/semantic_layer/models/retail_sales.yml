version: 0.3.0.dev0
name: retail_sales
description: Synthetic local retail orders
datasets:
- name: orders
  source: orders.main.orders
  primary_key:
  - id
  fields:
  - name: id
    expression:
      sql: id
  - name: amount
    expression:
      sql: amount
  - name: status
    expression:
      sql: status
    dimension: {}
  metrics:
  - name: revenue
    expression:
      sql: SUM(CASE WHEN status <> 'cancelled' THEN amount ELSE 0 END)
    description: Recognized revenue in EUR, excluding cancelled orders
  - name: completed_orders
    expression:
      sql: SUM(CASE WHEN status <> 'cancelled' THEN 1 ELSE 0 END)
    description: Count of completed orders
