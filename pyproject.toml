[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Governed metrics for autonomous agents: OKF context layer + OSI semantic layer behind one MCP facade"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # spike contract: datus-semantic-osi needs CPython 3.12
dependencies = [
    "duckdb>=1.0",
    "mcp>=1.2",
    "sqlglot>=25.0",  # ad-hoc source join parsing (grain guard, spec rev 5 §13)
    "openai>=1.40",
    "pyyaml>=6.0",
    "datus-semantic-osi[metricflow]==0.1.7",  # compile engine (docs/research/datus-spike.md §6.8; python 3.12 only)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["ariadne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
