# Lumio product-wide native test selection (spec 0031 §4). Tool-only file:
# no [project], no uv workspace — uv run/build invoked from this directory
# discover the real root workspace and its single development lock.
[pytest]
consider_namespace_packages = true
# Shared fixtures must also resolve in package-only focused runs; the
# repository root keeps the fully-qualified products.lumio.tests import
# working for the mixed root CI selection.
pythonpath = .
    ../..
# Lumio native full suite: product-wide tests, both member test trees, eval.
# Fixed four workers in CI and docs — never -n auto.
testpaths =
    tests
    packages/lumio-lancedb/tests
    packages/lumio-wiki/tests
    eval
