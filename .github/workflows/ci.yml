name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      # Root defaults are shared coordination coverage only (spec 0031 §4):
      # the shared tests/ tree plus the two paired integration modules.
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q -n 4
      # Lumio's native full suite and lint run scoped from its product area
      # with its own tool configuration (products/lumio/pytest.ini,
      # products/lumio/.ruff.toml) —
      # same selection and rules as before the product-area layout.
      - name: Lumio native lint (product config)
        run: uv run --locked ruff check .
        working-directory: products/lumio
      - name: Lumio native full suite (-n 4, never auto)
        run: uv run --locked pytest -q -n 4
        working-directory: products/lumio

  # Spec 0030 §5: joint source tests consume Core and SDK from the SAME
  # checked-out commit — no second repository and no public-SDK substitution
  # in this source-development job (the Core RELEASE job keeps its exact
  # published-producer pin). Separates the two test namespaces: this job runs
  # Core's member suite (plus the two paired integration modules, now under
  # integration/tests) under the member's own lint/pytest config, in a fresh
  # wheel environment without the optional LanceDB adapter.
  core-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - name: Core native lint (member config)
        run: uv run --locked --extra dev ruff check .
        working-directory: products/ariadne/packages/ariadne-data
      - name: Build the same-commit Core and SDK wheels
        run: |
          uv build --package ariadne-data --wheel --out-dir dist/core
          uv build --package lumio-wiki --wheel --out-dir dist/sdk
      - name: Fresh pair environment (Core + same-commit SDK, no adapter)
        run: |
          WHEEL=$(ls dist/core | grep whl)
          SDK=$(ls dist/sdk | grep whl)
          uv venv --python 3.14 /tmp/core-pair
          uv pip install --python /tmp/core-pair/bin/python \
            "./dist/core/$WHEEL[mcp,dev]" "./dist/sdk/$SDK"
      - name: Core native test selection (pair-installed, member config)
        run: |
          /tmp/core-pair/bin/python -m pytest -q \
            --ignore=tests/test_s3_lakehouse.py \
            --ignore=tests/test_s3_storage_access.py \
            --ignore=tests/test_s3_storage_profiles.py \
            "$GITHUB_WORKSPACE/integration/tests/lumio_metric_mvp.py" \
            "$GITHUB_WORKSPACE/integration/tests/lumio_local_context.py" \
            tests
        working-directory: products/ariadne/packages/ariadne-data
      # The standalone boundary: a separate Core-only base wheel environment
      # with the SDK and the MCP extra absent, exercising the installed CLI
      # and the human-admission journey outside the checkout with the
      # existing native walkthrough (tests/setup_wheel_walkthrough.py).
      - name: Standalone Core base wheel (SDK and MCP absent)
        run: |
          uv venv --python 3.14 /tmp/core-standalone
          uv pip install --python /tmp/core-standalone/bin/python \
            dist/core/ariadne_data-*.whl
          ! /tmp/core-standalone/bin/python -c 'import lumio_wiki' \
            || { echo 'SDK leaked into the standalone Core env'; exit 1; }
          ! /tmp/core-standalone/bin/python -c 'import mcp' \
            || { echo 'MCP leaked into the standalone Core env'; exit 1; }
      - name: Installed-wheel walkthrough outside the checkout
        run: |
          cd /tmp
          /tmp/core-standalone/bin/python \
            "$GITHUB_WORKSPACE/products/ariadne/packages/ariadne-data/tests/setup_wheel_walkthrough.py"


  # Issue #180, AC6: run the canonical onboarding journey
  # (products/lumio/docs/quickstart.md)
  # against a real S3-compatible service so the documented command sequence
  # cannot drift from the CLI. The admin/secret values are labelled local-test
  # credentials on an ephemeral CI container — never real credentials.
  onboarding-s3-compat-journey:
    runs-on: ubuntu-latest
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
        env:
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: secret
          S3_BUCKET: lumio-quickstart
        ports:
          - 8333:8333
        options: >-
          --health-cmd "curl -fsS http://localhost:9333/cluster/status"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LUMIO_S3_ENDPOINT: http://localhost:8333
      LUMIO_S3_ALLOW_HTTP: "1"
      LUMIO_S3_REGION: us-east-1
      LUMIO_S3_TEST_BUCKET: lumio-quickstart
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      LUMIO_S3_ACCESS_KEY_ID: admin
      LUMIO_S3_SECRET_ACCESS_KEY: secret
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - name: Run onboarding and public S3-compatible suites
        run: |
          uv run --locked pytest -q products/lumio/tests/test_onboarding_journey.py \
            products/lumio/packages/lumio-wiki/tests/*s3_compat.py \
            products/lumio/packages/lumio-lancedb/tests/*s3_compat.py

  isolated-lumio-wiki-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv build --package lumio-wiki --wheel --out-dir dist/lumio-wiki
      - run: uv build --package lumio-lancedb --wheel --out-dir dist/lumio-lancedb
      - run: uv venv --python 3.14 /tmp/lumio-wiki-venv
      - run: uv pip install --python /tmp/lumio-wiki-venv/bin/python dist/lumio-wiki/lumio_wiki-*.whl
      - name: Exercise only the installed lumio-wiki wheel
        run: |
          /tmp/lumio-wiki-venv/bin/python -I \
            products/lumio/scripts/verify_lumio_wiki_wheel.py \
            dist/lumio-wiki/lumio_wiki-*.whl \
            products/lumio/tests/fixtures/valid products/lumio/tests/fixtures/categorized_kb
      - name: Smoke the lumio-wiki[mcp] wheel (entry point, binding, search)
        run: |
          wheel=$(echo dist/lumio-wiki/lumio_wiki-*.whl)
          uv venv --python 3.14 /tmp/lumio-wiki-mcp-venv
          uv pip install --python /tmp/lumio-wiki-mcp-venv/bin/python "${wheel}[mcp]"
          # Console entry point: wiring + binding + serve startup; the server
          # exits cleanly on stdin EOF (AC1 from the installed wheel).
          timeout 60 /tmp/lumio-wiki-mcp-venv/bin/lumio-wiki mcp products/lumio/tests/fixtures/valid < /dev/null
          # Invalid KB: must fail fast (never hang), exit non-zero, and emit
          # the bounded message with no traceback. Timeout status 124 would
          # mask a hanging startup, so it is an explicit failure.
          status=0
          timeout 60 /tmp/lumio-wiki-mcp-venv/bin/lumio-wiki mcp products/lumio/tests/fixtures/invalid < /dev/null > /tmp/mcp-smoke-invalid.log 2>&1 || status=$?
          if [ "$status" -eq 124 ]; then
            echo "invalid-KB startup must fail fast, not hang" >&2
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "expected a non-zero exit for an invalid Knowledge Base" >&2
            exit 1
          fi
          grep -q "is invalid" /tmp/mcp-smoke-invalid.log
          ! grep -q "Traceback" /tmp/mcp-smoke-invalid.log
          # In-process tool seam: the search tool answers the expected hit.
          timeout 60 /tmp/lumio-wiki-mcp-venv/bin/python - <<'EOF'
          from lumio_wiki.location import FilesystemLocation, open_knowledge_base
          from lumio_wiki.mcp_server import build_server, search_rows
          snapshot = open_knowledge_base(FilesystemLocation("products/lumio/tests/fixtures/valid"))
          rows = search_rows(snapshot, "LanceDB")
          assert rows["results"] and rows["results"][0]["title"] == "Architecture"
          build_server(FilesystemLocation("products/lumio/tests/fixtures/valid"))
          print("mcp wheel smoke ok:", rows["results"][0]["path"])
          EOF
