name: publish

# Core-only release (owner decision 2026-10-19, ADR-0018) on the core-v*
# release channel (spec 0030 §5): a core-vX.Y.Z tag builds and publishes
# ariadne-data only, from one Core output directory (dist/core). ariadne-agent
# and tau-mcp are excluded until separately authorized; their versions and
# sources stay unchanged. Release qualification pairs the exact PUBLISHED
# lumio-wiki 0.4.1 producer wheel, fetched by immutable PyPI URL and verified
# against its recorded SHA-256 — never a workspace or source-built unreleased
# substitute (producer-first public pairing, spec 0030 §5). The tag must equal
# the ariadne-data member version. PyPI auth remains the PYPI_API_TOKEN
# repository secret; no credential-model change.

on:
  push:
    tags:
      - "core-v*"

permissions:
  contents: read # token publishing needs no OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false # no cache in the publishing job: a poisoned cache
          # must not reach released artifacts

      - name: Verify tag matches the core project version
        run: |
          TAG="${GITHUB_REF_NAME#core-v}"
          CORE=$(python3 -c "import tomllib; \
            print(tomllib.load(open('products/ariadne/packages/ariadne-data/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG core=$CORE"
          test "$TAG" = "$CORE" || { echo "core $CORE != tag $TAG"; exit 1; }

      - name: Build ariadne-data (core) into its own output directory
        run: uv build --package ariadne-data --out-dir dist/core

      - name: Fetch the exact published lumio-wiki producer wheel for pairing
        # Producer-first public pairing: the identity below is the real public
        # PyPI artifact (parent-fetched metadata, recorded in the migration
        # run state), pinned by immutable URL and SHA-256. This wheel is a
        # test-pairing input only and is never published by this job.
        run: |
          mkdir -p .ci-sdk-dist
          sdk_wheel=.ci-sdk-dist/lumio_wiki-0.4.1-py3-none-any.whl
          sha=47ec2f3e1f303f4bef156be4fac1d8ca5880ee2fc1356171a7bd2384a41bdaa3
          curl -fsSL -o "$sdk_wheel" \
            "https://files.pythonhosted.org/packages/7a/c9/1a5044ab0db1883f78049ead07616273569f1e0d8a044396d435f3cc6802/lumio_wiki-0.4.1-py3-none-any.whl"
          echo "lumio-wiki producer: published PyPI wheel lumio-wiki==0.4.1"
          echo "$sha  $sdk_wheel" | sha256sum -c -
          sha256sum "$sdk_wheel"

      - name: Run the core test suite on the built candidate
        run: |
          uv venv --python 3.14 .ci-venv
          WHEEL=$(ls dist/core | grep whl)
          SDK_WHEEL=$(ls .ci-sdk-dist | grep whl)
          uv pip install --python .ci-venv/bin/python \
            "./dist/core/$WHEEL[mcp,dev]" \
            "./.ci-sdk-dist/$SDK_WHEEL"
          # The three storage-profile/Lakehouse qualification modules are
          # capability-locked by spec 0025 (§§6–7): they require the prepared
          # environment (Docker + local SeaweedFS + installable httpfs) and
          # REFUSE — never skip — without it. A plain CI runner cannot provide
          # a freshly resolved DuckDB's httpfs build, so they are excluded
          # here instead of being silently skipped; the recorded qualification
          # evidence comes from that prepared environment (actual extension
          # versions asserted in the tests themselves).
          # The two Lumio SDK-paired modules carry non-default filenames and
          # are named explicitly so the exact pairing is visible; the
          # explicit tests path adds the default test_*.py suite in the
          # same single run. No skips beyond the three environment
          # exclusions above.
          .ci-venv/bin/python -m pytest -q \
            --ignore=products/ariadne/packages/ariadne-data/tests/test_s3_lakehouse.py \
            --ignore=products/ariadne/packages/ariadne-data/tests/test_s3_storage_access.py \
            --ignore=products/ariadne/packages/ariadne-data/tests/test_s3_storage_profiles.py \
            integration/tests/lumio_metric_mvp.py \
            integration/tests/lumio_local_context.py \
            products/ariadne/packages/ariadne-data/tests \
            || { echo "test failures block publishing"; exit 1; }

      - name: Publish ariadne-data (core)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        # Exact Core selection: only the artifacts built into dist/core.
        run: uv publish dist/core/*
