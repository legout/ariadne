[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Governed metrics for autonomous agents: OKF context layer + OSI semantic layer behind one MCP facade"
readme = "README.md"
requires-python = ">=3.12"  # ADR-0008: the datus <3.13 cap left with datus
dependencies = [
    "duckdb>=1.0",
    "mcp>=1.2,<2",  # 2.x renames FastMCP (facade tool registry) — migration is out of scope
    "sqlglot>=25.0",  # own compile engine: ariadne/render.py (ADR-0008) + grain guard
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
ariadne-ingest = "ariadne.ingest:main"
ariadne-author = "ariadne.author:main"
ariadne-validate = "ariadne.validate:main"
ariadne-serve = "ariadne.serve:main"
ariadne-promote = "ariadne.promote:main"
ariadne-init = "ariadne.init:main"

[project.optional-dependencies]
# ADR-0009 document ingestion: the lumio-wiki-researched converter stack. Optional
# so the base install stays lightweight; ariadne-ingest fails with install guidance
# when a converter is missing. dev gains the same deps so the test suite covers them.
documents = [
    "liteparse>=2.4.0",  # PDF
    "markitdown[docx]>=0.1.6",  # docx/pptx/xlsx
    "firecrawl-anydoc==0.1.3",  # html
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "liteparse>=2.4.0",
    "markitdown[docx]>=0.1.6",
    "firecrawl-anydoc==0.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
