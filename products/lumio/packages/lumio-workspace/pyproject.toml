[project]
name = "lumio-workspace"
version = "0.1.0"
description = "Authenticated, owner-managed shared workspace service for Lumio."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "lumio-wiki[documents,mcp]>=0.5.1,<0.6.0",
    "mcp>=2.2,<3",
    "authlib>=1.6,<2",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
]

[project.scripts]
lumio-workspace = "lumio_workspace.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumio_workspace"]
force-include = { "src/lumio_workspace/templates/setup.html" = "lumio_workspace/templates/setup.html" }
