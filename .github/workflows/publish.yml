name: publish

# Publish on every version change: pushing a v* tag builds both distributions
# and uploads them to PyPI. The tag must equal the version in BOTH pyproject
# files (checked below), so a version bump + tag is the one publishing path.
# PyPI auth: account API token via the PYPI_API_TOKEN repo secret (owner
# choice 2026-10-12, amending ADR-0018) — one token covers both
# distributions; no PyPI-side project setup needed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read # token publishing needs no OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pi-lens-ignore line-length

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5 pi-lens-ignore line-length
        with:
          enable-cache: false # no cache in the publishing job: a poisoned cache
          # must not reach released artifacts

      - name: Verify tag matches both project versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(python3 -c "import tomllib; \
            print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          AGENT=$(python3 -c "import tomllib; \
            print(tomllib.load( \
              open('ariadne-agent/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG core=$CORE agent=$AGENT"
          test "$TAG" = "$CORE" || { echo "core $CORE != tag $TAG"; exit 1; }
          test "$TAG" = "$AGENT" || { echo "agent $AGENT != tag $TAG"; exit 1; }

      - name: Build ariadne-data (core)
        run: uv build

      - name: Build ariadne-agent
        working-directory: ariadne-agent
        run: uv build

      - name: Run the core test suite on the built candidate
        run: |
          uv venv .ci-venv
          WHEEL=$(ls dist | grep whl)
          uv pip install --python .ci-venv/bin/python \
            "./dist/$WHEEL[mcp,dev]"
          .ci-venv/bin/python -m pytest -q \
            || { echo "test failures block publishing"; exit 1; }

      - name: Publish ariadne-data (core)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Publish ariadne-agent
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
        working-directory: ariadne-agent
